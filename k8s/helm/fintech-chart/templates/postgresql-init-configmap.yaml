{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fintech-chart.fullname" . }}-postgresql-init
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "fintech-chart.labels" . | nindent 4 }}
    component: database-init
data:
  01-init-schema.sql: |
    -- 金融微服務數據庫初始化腳本
    -- 創建基礎表結構用於交易、風險、支付和審計服務

    -- 用戶表
    CREATE TABLE IF NOT EXISTS users (
        id SERIAL PRIMARY KEY,
        username VARCHAR(50) UNIQUE NOT NULL,
        email VARCHAR(100) UNIQUE NOT NULL,
        password_hash VARCHAR(255) NOT NULL,
        full_name VARCHAR(100),
        phone VARCHAR(20),
        status VARCHAR(20) DEFAULT 'active',
        risk_level INTEGER DEFAULT 5,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    -- 賬戶表
    CREATE TABLE IF NOT EXISTS accounts (
        id SERIAL PRIMARY KEY,
        user_id INTEGER REFERENCES users(id),
        account_number VARCHAR(20) UNIQUE NOT NULL,
        account_type VARCHAR(20) DEFAULT 'trading',
        balance DECIMAL(15,2) DEFAULT 0.00,
        available_balance DECIMAL(15,2) DEFAULT 0.00,
        currency VARCHAR(3) DEFAULT 'USD',
        status VARCHAR(20) DEFAULT 'active',
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    -- 股票信息表
    CREATE TABLE IF NOT EXISTS stocks (
        id SERIAL PRIMARY KEY,
        symbol VARCHAR(10) UNIQUE NOT NULL,
        name VARCHAR(100) NOT NULL,
        exchange VARCHAR(20),
        sector VARCHAR(50),
        current_price DECIMAL(10,2),
        previous_close DECIMAL(10,2),
        market_cap BIGINT,
        volume BIGINT DEFAULT 0,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    -- 持倉表
    CREATE TABLE IF NOT EXISTS holdings (
        id SERIAL PRIMARY KEY,
        user_id INTEGER REFERENCES users(id),
        stock_id INTEGER REFERENCES stocks(id),
        symbol VARCHAR(10) NOT NULL,
        quantity INTEGER NOT NULL DEFAULT 0,
        avg_price DECIMAL(10,2) NOT NULL,
        total_cost DECIMAL(15,2) NOT NULL,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        UNIQUE(user_id, stock_id)
    );

    -- 訂單表
    CREATE TABLE IF NOT EXISTS orders (
        id SERIAL PRIMARY KEY,
        user_id INTEGER REFERENCES users(id),
        stock_id INTEGER REFERENCES stocks(id),
        symbol VARCHAR(10) NOT NULL,
        order_type VARCHAR(20) NOT NULL,
        side VARCHAR(4) NOT NULL,
        quantity INTEGER NOT NULL,
        price DECIMAL(10,2),
        filled_quantity INTEGER DEFAULT 0,
        remaining_quantity INTEGER NOT NULL,
        status VARCHAR(20) DEFAULT 'PENDING',
        order_date TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        filled_date TIMESTAMP,
        commission DECIMAL(10,2) DEFAULT 0.00,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    -- 交易記錄表
    CREATE TABLE IF NOT EXISTS trades (
        id SERIAL PRIMARY KEY,
        order_id INTEGER REFERENCES orders(id),
        user_id INTEGER REFERENCES users(id),
        symbol VARCHAR(10) NOT NULL,
        side VARCHAR(4) NOT NULL,
        quantity INTEGER NOT NULL,
        price DECIMAL(10,2) NOT NULL,
        total_amount DECIMAL(15,2) NOT NULL,
        commission DECIMAL(10,2) DEFAULT 0.00,
        trade_date TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    -- 風險指標表
    CREATE TABLE IF NOT EXISTS risk_metrics (
        id SERIAL PRIMARY KEY,
        user_id INTEGER REFERENCES users(id),
        portfolio_value DECIMAL(15,2),
        var_95 DECIMAL(15,2),
        beta DECIMAL(5,3),
        sharpe_ratio DECIMAL(5,3),
        volatility DECIMAL(5,3),
        max_drawdown DECIMAL(5,3),
        risk_score INTEGER,
        calculated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    -- 支付記錄表
    CREATE TABLE IF NOT EXISTS payments (
        id SERIAL PRIMARY KEY,
        user_id INTEGER REFERENCES users(id),
        payment_type VARCHAR(20) NOT NULL,
        amount DECIMAL(15,2) NOT NULL,
        currency VARCHAR(3) DEFAULT 'USD',
        payment_method VARCHAR(50),
        reference_id VARCHAR(100),
        status VARCHAR(20) DEFAULT 'PENDING',
        processed_at TIMESTAMP,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    -- 審計日誌表
    CREATE TABLE IF NOT EXISTS audit_logs (
        id SERIAL PRIMARY KEY,
        user_id INTEGER,
        action VARCHAR(50) NOT NULL,
        resource_type VARCHAR(50),
        resource_id INTEGER,
        old_values JSONB,
        new_values JSONB,
        ip_address INET,
        user_agent TEXT,
        timestamp TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    -- 系統配置表
    CREATE TABLE IF NOT EXISTS system_configs (
        id SERIAL PRIMARY KEY,
        config_key VARCHAR(100) UNIQUE NOT NULL,
        config_value TEXT,
        description TEXT,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    -- 市場時間表
    CREATE TABLE IF NOT EXISTS market_schedule (
        id SERIAL PRIMARY KEY,
        date DATE UNIQUE NOT NULL,
        is_trading_day BOOLEAN DEFAULT true,
        market_open TIME DEFAULT '09:30:00',
        market_close TIME DEFAULT '16:00:00',
        notes TEXT,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    -- 創建索引
    CREATE INDEX IF NOT EXISTS idx_orders_user_id ON orders(user_id);
    CREATE INDEX IF NOT EXISTS idx_orders_symbol ON orders(symbol);
    CREATE INDEX IF NOT EXISTS idx_orders_status ON orders(status);
    CREATE INDEX IF NOT EXISTS idx_trades_user_id ON trades(user_id);
    CREATE INDEX IF NOT EXISTS idx_trades_symbol ON trades(symbol);
    CREATE INDEX IF NOT EXISTS idx_holdings_user_id ON holdings(user_id);
    CREATE INDEX IF NOT EXISTS idx_audit_logs_user_id ON audit_logs(user_id);
    CREATE INDEX IF NOT EXISTS idx_audit_logs_timestamp ON audit_logs(timestamp);
    CREATE INDEX IF NOT EXISTS idx_users_username ON users(username);
    CREATE INDEX IF NOT EXISTS idx_users_email ON users(email);
    CREATE INDEX IF NOT EXISTS idx_accounts_user_id ON accounts(user_id);
    CREATE INDEX IF NOT EXISTS idx_accounts_account_number ON accounts(account_number);
    CREATE INDEX IF NOT EXISTS idx_stocks_symbol ON stocks(symbol);
    CREATE INDEX IF NOT EXISTS idx_market_schedule_date ON market_schedule(date);

    -- 更新時間戳觸發器
    CREATE OR REPLACE FUNCTION update_updated_at_column()
    RETURNS TRIGGER AS $$
    BEGIN
        NEW.updated_at = CURRENT_TIMESTAMP;
        RETURN NEW;
    END;
    $$ language 'plpgsql';

    -- 為表添加更新時間戳觸發器
    DROP TRIGGER IF EXISTS update_users_updated_at ON users;
    CREATE TRIGGER update_users_updated_at 
        BEFORE UPDATE ON users 
        FOR EACH ROW 
        EXECUTE FUNCTION update_updated_at_column();

    DROP TRIGGER IF EXISTS update_accounts_updated_at ON accounts;
    CREATE TRIGGER update_accounts_updated_at 
        BEFORE UPDATE ON accounts 
        FOR EACH ROW 
        EXECUTE FUNCTION update_updated_at_column();

    DROP TRIGGER IF EXISTS update_stocks_updated_at ON stocks;
    CREATE TRIGGER update_stocks_updated_at 
        BEFORE UPDATE ON stocks 
        FOR EACH ROW 
        EXECUTE FUNCTION update_updated_at_column();

    DROP TRIGGER IF EXISTS update_holdings_updated_at ON holdings;
    CREATE TRIGGER update_holdings_updated_at 
        BEFORE UPDATE ON holdings 
        FOR EACH ROW 
        EXECUTE FUNCTION update_updated_at_column();

    DROP TRIGGER IF EXISTS update_orders_updated_at ON orders;
    CREATE TRIGGER update_orders_updated_at 
        BEFORE UPDATE ON orders 
        FOR EACH ROW 
        EXECUTE FUNCTION update_updated_at_column();

    DROP TRIGGER IF EXISTS update_system_configs_updated_at ON system_configs;
    CREATE TRIGGER update_system_configs_updated_at 
        BEFORE UPDATE ON system_configs 
        FOR EACH ROW 
        EXECUTE FUNCTION update_updated_at_column();

