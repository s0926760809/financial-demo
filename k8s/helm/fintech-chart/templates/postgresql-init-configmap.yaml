    ON CONFLICT (config_key) DO NOTHING;

  03-verify-setup.sql: |
    -- 驗證數據庫設置
    DO $$
    DECLARE
        table_count INTEGER;
        stock_count INTEGER;
        user_count INTEGER;
        config_count INTEGER;
    BEGIN
        -- 統計表數量
        SELECT COUNT(*) INTO table_count 
        FROM information_schema.tables 
        WHERE table_schema = 'public' AND table_type = 'BASE TABLE';
        
        -- 統計數據
        SELECT COUNT(*) INTO stock_count FROM stocks;
        SELECT COUNT(*) INTO user_count FROM users;
        SELECT COUNT(*) INTO config_count FROM system_configs;
        
        -- 輸出統計信息
        RAISE NOTICE '🎉 金融微服務數據庫初始化完成!';
        RAISE NOTICE '📊 已創建 % 張業務表', table_count;
        RAISE NOTICE '💰 已配置 % 支股票', stock_count;
        RAISE NOTICE '👥 已創建 % 個演示用戶', user_count;
        RAISE NOTICE '⚙️  已配置 % 個系統參數', config_count;
        RAISE NOTICE '🚀 系統準備就緒，可開始模擬交易!';
        
        -- 確保系統配置正確標記
        INSERT INTO system_configs (config_key, config_value, description) VALUES
            ('helm_db_init_completed', to_char(CURRENT_TIMESTAMP, 'YYYY-MM-DD HH24:MI:SS'), 'Helm 數據庫初始化完成時間')
        ON CONFLICT (config_key) DO UPDATE SET 
            config_value = EXCLUDED.config_value,
            updated_at = CURRENT_TIMESTAMP;
    END $$;
{{- end }} 