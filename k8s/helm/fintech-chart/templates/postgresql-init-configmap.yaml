    ('GOOGL', '谷歌', 'NASDAQ', '科技股', 2567.89, 2555.55, 1700000000000, 12345678),
    ('AMZN', '亞馬遜', 'NASDAQ', '科技股', 3245.12, 3231.45, 1650000000000, 8765432),
    ('NVDA', '英偉達', 'NASDAQ', '科技股', 890.45, 885.20, 2200000000000, 15678901),
