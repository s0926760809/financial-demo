{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "fintech-chart.fullname" . }}-ingress-audit
  labels:
    {{- include "fintech-chart.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  ingressClassName: nginx
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          # Audit API 路由 - 需要路徑重寫
          - path: /api/audit/(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: audit-service-service
                port:
                  number: 8083
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "fintech-chart.fullname" . }}-ingress
  labels:
    {{- include "fintech-chart.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/websocket-services: "fintech-demo-fintech-chart-tetragon-stream"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/use-regex: "true"
  {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: nginx
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          # API v1路由到trading-api (優先級最高)
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: trading-api-service
                port:
                  number: 8080
          # 其他API路由
          - path: /api/risk
            pathType: Prefix
            backend:
              service:
                name: risk-engine-service
                port:
                  number: 8081
          - path: /api/payment
            pathType: Prefix
            backend:
              service:
                name: payment-gateway-service
                port:
                  number: 8082
          # Tetragon API路由
          - path: /api/events
            pathType: Prefix
            backend:
              service:
                name: fintech-demo-fintech-chart-tetragon-stream
                port:
                  number: 8090
          - path: /api/namespaces
            pathType: Prefix
            backend:
              service:
                name: fintech-demo-fintech-chart-tetragon-stream
                port:
                  number: 8090
          - path: /api/services
            pathType: Prefix
            backend:
              service:
                name: fintech-demo-fintech-chart-tetragon-stream
                port:
                  number: 8090
          # Tetragon WebSocket事件流路由
          - path: /ws/events
            pathType: Prefix
            backend:
              service:
                name: fintech-demo-fintech-chart-tetragon-stream
                port:
                  number: 8090
          # WebSocket路由
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: audit-service-service
                port:
                  number: 8083
          # 前端路由 - 預設處理（最低優先級）
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: {{ $.Values.frontend.service.port }}
    {{- end }}
{{- end }} 