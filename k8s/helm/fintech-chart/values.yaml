# ==========================================
# 金融微服務 eBPF 演示系統 - Helm 配置檔案
# ==========================================

# 全域設定
global:
  image:
    tag: v4.0
    pullPolicy: IfNotPresent
  # 命名空間設定
  namespace: fintech-demo
  # 應用標籤
  labels:
    app.kubernetes.io/name: fintech-demo
    app.kubernetes.io/component: fintech-microservices
    app.kubernetes.io/version: "v4.0"

# 前端應用配置
frontend:
  enabled: true
  replicaCount: 2  # 增加副本數以提升可用性
  image:
    repository: quay.io/s0926760809/fintech-frontend
    tag: "latest"
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
  # 資源配置
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  # 健康檢查配置
  livenessProbe:
    httpGet:
      path: /
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 5

# Tetragon 安全監控服務配置
tetragonStream:
  enabled: true
  replicaCount: 1
  image:
    repository: quay.io/s0926760809/fintech-tetragon-stream
    tag: "latest"
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 8090
    targetPort: 8090
  # 資源配置 (監控服務需要更多資源)
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  # 環境變數配置
  env:
    - name: LOG_LEVEL
      value: "INFO"
    - name: TETRAGON_MONITORING_ENABLED
      value: "true"

# 後端微服務通用配置
backend:
  replicaCount: 2  # 提升可用性
  # 共用資源配置
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  # 共用健康檢查配置
  healthcheck:
    livenessProbe:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 15
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3

# 後端微服務詳細配置
backendServices:
  - name: trading-api
    description: "交易 API 服務 - 核心交易邏輯處理"
    image:
      repository: quay.io/s0926760809/fintech-trading-api
      tag: latest
    service:
      type: ClusterIP
      port: 8080
      targetPort: 8080
    # 特殊配置：交易服務需要更多資源
    resources:
      requests:
        memory: "512Mi"
        cpu: "300m"
      limits:
        memory: "1Gi"
        cpu: "800m"
    env:
      - name: SERVER_PORT
        value: "8080"
      - name: DATABASE_HOST
        value: "fintech-demo-postgresql"
      - name: DATABASE_USER
        valueFrom:
          secretKeyRef:
            name: fintech-secrets
            key: database-username
      - name: DATABASE_PASSWORD
        valueFrom:
          secretKeyRef:
            name: fintech-secrets
            key: database-password
      - name: DATABASE_NAME
        value: "fintech_demo"
      - name: REDIS_HOST
        value: "fintech-demo-redis-master"
      - name: REDIS_PASSWORD
        value: ""
      - name: LOG_LEVEL
        value: "INFO"
      - name: TETRAGON_ENABLED
        value: "true"

  - name: risk-engine
    description: "風險引擎服務 - 風險評估與控制"
    image:
      repository: quay.io/s0926760809/fintech-risk-engine
      tag: latest
    service:
      type: ClusterIP
      port: 8081
      targetPort: 8081
    env:
      - name: DATABASE_HOST
        value: "fintech-demo-postgresql"
      - name: DATABASE_USER
        valueFrom:
          secretKeyRef:
            name: fintech-secrets
            key: database-username
      - name: DATABASE_PASSWORD
        valueFrom:
          secretKeyRef:
            name: fintech-secrets
            key: database-password
      - name: DATABASE_NAME
        value: "fintech_demo"
      - name: REDIS_HOST
        value: "fintech-demo-redis-master"
      - name: REDIS_PASSWORD
        value: ""
      - name: LOG_LEVEL
        value: "INFO"
      - name: RISK_THRESHOLD_HIGH
        value: "0.8"
      - name: RISK_THRESHOLD_MEDIUM
        value: "0.5"

  - name: payment-gateway
    description: "支付閘道服務 - 支付處理與管理"
    image:
      repository: quay.io/s0926760809/fintech-payment-gateway
      tag: latest
    service:
      type: ClusterIP
      port: 8082
      targetPort: 8082
    env:
      - name: DATABASE_HOST
        value: "fintech-demo-postgresql"
      - name: DATABASE_USER
        valueFrom:
          secretKeyRef:
            name: fintech-secrets
            key: database-username
      - name: DATABASE_PASSWORD
        valueFrom:
          secretKeyRef:
            name: fintech-secrets
            key: database-password
      - name: DATABASE_NAME
        value: "fintech_demo"
      - name: REDIS_HOST
        value: "fintech-demo-redis-master"
      - name: REDIS_PASSWORD
        value: ""
      - name: LOG_LEVEL
        value: "INFO"
      - name: PAYMENT_TIMEOUT
        value: "30s"

  - name: audit-service
    description: "審計服務 - 日誌記錄與合規監控"
    image:
      repository: quay.io/s0926760809/fintech-audit-service
      tag: latest
    service:
      type: ClusterIP
      port: 8083
      targetPort: 8083
    env:
      - name: DATABASE_HOST
        value: "fintech-demo-postgresql"
      - name: DATABASE_USER
        valueFrom:
          secretKeyRef:
            name: fintech-secrets
            key: database-username
      - name: DATABASE_PASSWORD
        valueFrom:
          secretKeyRef:
            name: fintech-secrets
            key: database-password
      - name: DATABASE_NAME
        value: "fintech_demo"
      - name: REDIS_HOST
        value: "fintech-demo-redis-master"
      - name: REDIS_PASSWORD
        value: ""
      - name: LOG_LEVEL
        value: "INFO"
      - name: WEBSOCKET_ENABLED
        value: "true"
      - name: AUDIT_RETENTION_DAYS
        value: "90"

# ==========================================
# 資料庫與快取服務配置
# ==========================================

# PostgreSQL 資料庫配置
postgresql:
  enabled: true
  auth:
    username: "fintech_user"
    password: "password123"  # 注意：生產環境應使用 Secret 管理
    database: "fintech_demo"
    existingSecret: ""  # 可指定現有的 Secret
  # 主要資料庫節點配置
  primary:
    persistence:
      enabled: true
      size: 20Gi  # 增加儲存空間
      storageClass: ""  # 可指定特定的 StorageClass
    # 數據庫初始化配置
    initdb:
      scripts:
        # 參考 ConfigMap 中的初始化腳本
        01-init-schema.sql: |
          -- 此腳本將從 ConfigMap 中載入
          \echo 'Loading database schema from ConfigMap...'
        02-insert-sample-data.sql: |
          -- 此腳本將從 ConfigMap 中載入  
          \echo 'Loading sample data from ConfigMap...'
        03-verify-setup.sql: |
          -- 此腳本將從 ConfigMap 中載入
          \echo 'Verifying database setup from ConfigMap...'
    # 掛載初始化腳本 ConfigMap (暫時註釋以避免掛載問題)
    # extraVolumes:
    #   - name: postgresql-init-scripts
    #     configMap:
    #       name: fintech-demo-fintech-chart-postgresql-init
    # extraVolumeMounts:
    #   - name: postgresql-init-scripts
    #     mountPath: /docker-entrypoint-initdb.d
    #     readOnly: true
    resources:
      requests:
        memory: "256Mi"
        cpu: "250m"
      limits:
        memory: "1Gi"
        cpu: "1000m"
    # PostgreSQL 配置調整
    extendedConfiguration: |
      max_connections = 200
      shared_buffers = 256MB
      effective_cache_size = 768MB
      work_mem = 4MB
      maintenance_work_mem = 64MB
      checkpoint_completion_target = 0.9
      wal_buffers = 16MB
      default_statistics_target = 100
  # 備份配置
  backup:
    enabled: false  # 可根據需要啟用
  # 監控配置
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false  # 如果有 Prometheus Operator 可啟用

# Redis 快取服務配置
redis:
  enabled: true
  architecture: standalone  # 單機模式，生產環境建議使用 replication
  auth:
    enabled: false  # 簡化設置，生產環境建議啟用
    password: ""
  # 主節點配置
  master:
    persistence:
      enabled: true
      size: 8Gi
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "500m"
    # Redis 配置
    configuration: |
      maxmemory 256mb
      maxmemory-policy allkeys-lru
      save 900 1
      save 300 10
      save 60 10000
  # 監控配置
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false

# ==========================================
# 網路與安全配置
# ==========================================

# Ingress 網路進入點配置
ingress:
  enabled: true
  className: "nginx"  # 指定 Ingress Class
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    # WebSocket 支援 (用於實時監控)
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    # 安全標頭配置已移除 (nginx ingress controller 禁用了 snippet 指令)
  # 主機配置
  hosts:
    - host: fintech-demo.local
      paths:
        # API路由 - 必須在前端路由之前
        - path: /api
          pathType: Prefix
          backend:
            service:
              name: trading-api-service
              port:
                number: 8080
        # WebSocket路由
        - path: /ws
          pathType: Prefix
          backend:
            service:
              name: fintech-demo-fintech-chart-tetragon-stream
              port:
                number: 8090
        # Tetragon API路由
        - path: /tetragon
          pathType: Prefix
          backend:
            service:
              name: fintech-demo-fintech-chart-tetragon-stream
              port:
                number: 8090
        # 前端路由 - 必須在最後，作為默認路由
        - path: /
          pathType: Prefix
          backend:
            service:
              name: frontend
              port:
                number: 80
  # TLS 憑證配置
  tls:
    - secretName: fintech-demo-tls
      hosts:
        - fintech-demo.local

# ==========================================
# 監控與觀測性配置
# ==========================================

# 服務監控配置
serviceMonitor:
  enabled: false  # 需要 Prometheus Operator
  labels:
    app: fintech-demo
  interval: 30s
  path: /metrics

# 網路政策配置
networkPolicy:
  enabled: false  # 可根據安全需求啟用
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
  egress:
    - to: []

# ==========================================
# 安全與合規配置
# ==========================================

# Pod 安全政策
podSecurityPolicy:
  enabled: false  # 如果叢集支援可啟用

# 服務帳戶配置
serviceAccount:
  create: true
  annotations: {}
  name: "fintech-demo"

# RBAC 權限配置
rbac:
  create: true

# Pod 安全內容
podSecurityContext:
  fsGroup: 2000
  runAsNonRoot: true
  runAsUser: 1000

# 容器安全內容
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

# ==========================================
# 效能與擴展配置
# ==========================================

# 水平 Pod 自動擴展 (HPA)
autoscaling:
  enabled: false  # 可根據需要啟用
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Pod 中斷預算 (PDB)
podDisruptionBudget:
  enabled: true
  minAvailable: 1
  # maxUnavailable: 50%

# 節點親和性配置
nodeAffinity:
  enabled: false
  # 可根據需要配置節點選擇器

# Pod 反親和性配置 (提升可用性)
podAntiAffinity:
  enabled: true
  # preferredDuringSchedulingIgnoredDuringExecution 提供軟性約束
  weight: 100 