# Global settings
global:
  image:
    tag: v4.0
    pullPolicy: IfNotPresent

# Frontend Configuration
frontend:
  enabled: true
  replicaCount: 1
  image:
    repository: quay.io/s0926760809/frontend
    tag: "v4.7"
    pullPolicy: Always
  service:
    port: 80
    targetPort: 8080

# Tetragon Stream Service Configuration
tetragonStream:
  enabled: true
  replicaCount: 1
  image:
    repository: quay.io/s0926760809/tetragon-stream
    tag: "v4.7"
    pullPolicy: Always
  service:
    port: 8090
    targetPort: 8090
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"

# Backend Services Common Configuration
backend:
  replicaCount: 1

backendServices:
  - name: trading-api
    image:
      repository: quay.io/s0926760809/fintech-demo/trading-api
      tag: v4.0
    service:
      port: 8080
      targetPort: 8080
    env:
      - name: SERVER_PORT
        value: "8080"
      - name: DATABASE_HOST
        value: "fintech-demo-postgresql"
      - name: DATABASE_USER
        value: "fintech_user"
      - name: DATABASE_PASSWORD
        value: "password123"
      - name: DATABASE_NAME
        value: "fintech_demo"
      - name: REDIS_HOST
        value: "fintech-demo-redis-master"
      - name: REDIS_PASSWORD
        value: ""
  - name: risk-engine
    image:
      repository: quay.io/s0926760809/fintech-demo/risk-engine
      tag: v4.0
    service:
      port: 8081
      targetPort: 8081
    env:
      - name: DATABASE_HOST
        value: "fintech-demo-postgresql"
      - name: DATABASE_USER
        value: "fintech_user"
      - name: DATABASE_PASSWORD
        value: "password123"
      - name: DATABASE_NAME
        value: "fintech_demo"
      - name: REDIS_HOST
        value: "fintech-demo-redis-master"
      - name: REDIS_PASSWORD
        value: ""
  - name: payment-gateway
    image:
      repository: quay.io/s0926760809/fintech-demo/payment-gateway
      tag: v4.0
    service:
      port: 8082
      targetPort: 8082
    env:
      - name: DATABASE_HOST
        value: "fintech-demo-postgresql"
      - name: DATABASE_USER
        value: "fintech_user"
      - name: DATABASE_PASSWORD
        value: "password123"
      - name: DATABASE_NAME
        value: "fintech_demo"
      - name: REDIS_HOST
        value: "fintech-demo-redis-master"
      - name: REDIS_PASSWORD
        value: ""
  - name: audit-service
    image:
      repository: quay.io/s0926760809/fintech-demo/audit-service
      tag: v4.0
    service:
      port: 8083
      targetPort: 8083
    env:
      - name: DATABASE_HOST
        value: "fintech-demo-postgresql"
      - name: DATABASE_USER
        value: "fintech_user"
      - name: DATABASE_PASSWORD
        value: "password123"
      - name: DATABASE_NAME
        value: "fintech_demo"
      - name: REDIS_HOST
        value: "fintech-demo-redis-master"
      - name: REDIS_PASSWORD
        value: ""

# Database (PostgreSQL) Dependency Configuration
postgresql:
  enabled: true
  auth:
    username: "fintech_user"
    password: "password123"
    database: "fintech_demo"
  primary:
    persistence:
      enabled: true
      size: 10Gi

# Cache (Redis) Dependency Configuration
redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: false
  master:
    persistence:
      enabled: true
      size: 5Gi

# Ingress Configuration
ingress:
  enabled: true
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
  hosts:
    - host: fintech-demo.local
  tls: [] 