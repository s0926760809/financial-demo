apiVersion: apps/v1
kind: Deployment
metadata:
  name: tetragon-stream
  namespace: fintech-demo
  labels:
    app: tetragon-stream
    version: v4.0
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tetragon-stream
  template:
    metadata:
      labels:
        app: tetragon-stream
        version: v4.0
    spec:
      serviceAccountName: tetragon-stream
      imagePullSecrets:
      - name: quay-secret
      containers:
      - name: tetragon-stream
        image: quay.io/s0926760809/tetragon-stream:v4.0
        imagePullPolicy: Always
        ports:
        - containerPort: 8090
          name: http
        env:
        - name: PORT
          value: "8090"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8090
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8090
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: tetragon-stream
  namespace: fintech-demo
  labels:
    app: tetragon-stream
spec:
  type: ClusterIP
  ports:
  - port: 8090
    targetPort: 8090
    protocol: TCP
    name: http
  selector:
    app: tetragon-stream
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tetragon-stream
  namespace: fintech-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tetragon-stream
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
- apiGroups: ["cilium.io"]
  resources: ["tracingpolicies"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tetragon-stream
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tetragon-stream
subjects:
- kind: ServiceAccount
  name: tetragon-stream
  namespace: fintech-demo 